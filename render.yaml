services:
  - type: web
    name: defect-management-application
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/defects.db
    disk:
      name: defect-db-storage
      mountPath: /var/data
      sizeGB: 1
